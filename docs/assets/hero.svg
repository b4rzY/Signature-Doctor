<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Signature Doctor — AngelScript workbench</title>
  <desc id="desc">Know what survived the update. A signature and offset maintenance workbench for compatible AngelScript hosts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101820"/>
      <stop offset="1" stop-color="#080D13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1190 245) rotate(90) scale(320 410)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5AC64" stop-opacity=".10"/>
      <stop offset="1" stop-color="#E5AC64" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A9B5C5" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="stroke" x1="853" y1="147" x2="1362" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DAA462" stop-opacity=".8"/>
      <stop offset="1" stop-color="#DAA462" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="520" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="20" fill="url(#grid)"/>
  <rect width="1440" height="520" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1439" height="519" rx="19.5" stroke="#28313B"/>
  <path d="M21 1H1419" stroke="#E5AC64" stroke-opacity=".8"/>

  <g transform="translate(64 51)">
    <rect width="42" height="42" rx="11" fill="#E5AC64"/>
    <path d="M9 22H15L19 12L24 31L28 22H34" stroke="#111820" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" fill="#A5B0BC" font-family="SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="1.7">ANGELSCRIPT WORKBENCH</text>
  </g>
  <text x="64" y="160" fill="#E5AC64" font-family="SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="3">SIGNATURE &amp; OFFSET MAINTENANCE</text>
  <text x="60" y="238" fill="#F2EEE7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="650" letter-spacing="-3.8">Signature Doctor<tspan fill="#E5AC64">.</tspan></text>
  <text x="64" y="292" fill="#CCD3DA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="-.5">Know what survived the update.</text>
  <text x="64" y="342" fill="#8593A3" font-family="Segoe UI, Arial, sans-serif" font-size="17">Resolve every recipe. Understand every change.</text>
  <text x="64" y="370" fill="#8593A3" font-family="Segoe UI, Arial, sans-serif" font-size="17">Export only what you reviewed.</text>

  <g font-family="SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.1">
    <rect x="64" y="425" width="131" height="32" rx="6" fill="#15251F" stroke="#294537"/>
    <circle cx="81" cy="441" r="3" fill="#8CBF9E"/>
    <text x="93" y="445" fill="#A8C9B5">LOCAL FIRST</text>
    <rect x="205" y="425" width="151" height="32" rx="6" fill="#1C222A" stroke="#313A46"/>
    <text x="222" y="445" fill="#A4AFBD">ANGELSCRIPT</text>
    <rect x="366" y="425" width="159" height="32" rx="6" fill="#1C222A" stroke="#313A46"/>
    <text x="383" y="445" fill="#A4AFBD">REVIEW → EXPORT</text>
  </g>

  <g transform="translate(874 101)">
    <rect x="0" y="0" width="502" height="314" rx="14" fill="#0C1219" stroke="#2F3740"/>
    <path d="M0 44H502" stroke="#28313B"/>
    <circle cx="20" cy="22" r="3" fill="#E5AC64"/>
    <text x="34" y="27" fill="#A8B3C0" font-family="SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">THE MAINTENANCE LOOP</text>
    <text x="442" y="27" fill="#617080" font-family="SFMono-Regular, Consolas, monospace" font-size="11">v1.1</text>

    <path d="M58 109H151C167 109 171 113 171 129V157C171 173 175 177 191 177H284" stroke="url(#stroke)" stroke-width="1.5"/>
    <path d="M58 109V240H418V177" stroke="#304238" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M308 177H380" stroke="#7E9F8E" stroke-width="1.5"/>
    <circle cx="58" cy="109" r="21" fill="#2B251D" stroke="#B58B54"/>
    <path d="M50 109H66M58 101V117" stroke="#E5AC64" stroke-width="1.8" stroke-linecap="round"/>
    <text x="95" y="82" fill="#CED5DD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Your catalog</text>
    <text x="95" y="100" fill="#6D7C8D" font-family="SFMono-Regular, Consolas, monospace" font-size="10">patterns · RVAs · chains</text>

    <rect x="213" y="156" width="104" height="42" rx="8" fill="#1B232E" stroke="#48546A"/>
    <text x="232" y="182" fill="#B9C8DF" font-family="SFMono-Regular, Consolas, monospace" font-size="11">VALIDATE</text>
    <rect x="371" y="156" width="94" height="42" rx="8" fill="#1B2C23" stroke="#47614F"/>
    <path d="M385 178L389 182L396 173" stroke="#8CBF9E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="405" y="181" fill="#A8C9B5" font-family="SFMono-Regular, Consolas, monospace" font-size="11">REVIEW</text>

    <text x="26" y="284" fill="#647383" font-family="SFMono-Regular, Consolas, monospace" font-size="10">DETERMINISTIC RECIPES</text>
    <text x="309" y="284" fill="#A9987D" font-family="SFMono-Regular, Consolas, monospace" font-size="10">HUMAN-REVIEWED RESULTS</text>
  </g>
</svg>
